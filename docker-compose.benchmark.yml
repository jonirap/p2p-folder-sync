services:
  peer-alpha:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./sync-data-alpha:/app/sync:delegated
      - p2p-sync-db-alpha:/app/data
      - ./config:/app/config:ro
    ports:
      - "8080:8080"
      - "8081:8081/udp"
    environment:
      - P2P_SYNC_FOLDER=/app/sync
      - P2P_CONFIG_PATH=/app/config/config.yaml
      - PEER_ID=alpha
      - PEERS=peer-beta:8080
    networks:
      p2p-benchmark-network:
        ipv4_address: 172.25.0.10
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  peer-beta:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./sync-data-beta:/app/sync:delegated
      - p2p-sync-db-beta:/app/data
      - ./config:/app/config:ro
    ports:
      - "8082:8080"
      - "8083:8081/udp"
    environment:
      - P2P_SYNC_FOLDER=/app/sync
      - P2P_CONFIG_PATH=/app/config/config.yaml
      - PEER_ID=beta
      - PEERS=peer-alpha:8080
    networks:
      p2p-benchmark-network:
        ipv4_address: 172.25.0.20
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Network simulator container to add latency, packet loss, bandwidth limits
  network-sim:
    image: alpine:latest
    container_name: p2p-network-sim
    command: >
      sh -c "apk add --no-cache iproute2 &&
             while true; do sleep 3600; done"
    networks:
      p2p-benchmark-network:
        ipv4_address: 172.25.0.5
    cap_add:
      - NET_ADMIN
    privileged: true

volumes:
  p2p-sync-db-alpha:
  p2p-sync-db-beta:

networks:
  p2p-benchmark-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
          gateway: 172.25.0.1
